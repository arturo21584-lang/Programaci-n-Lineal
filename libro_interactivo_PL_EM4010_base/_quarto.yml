project:
  type: book
  output-dir: _site

lang: es
language:
  title-block-author-single: "Autor"

book:
  title: "Programación Lineal"
  subtitle: "Geometría, algoritmos y decisiones"
  search: true
  reader-mode: true
  page-navigation: true
  navbar:
    background: "#183B45"
    foreground: "#FFFFFF"
    left:
      - text: "Libro"
        href: index.qmd
      - text: "Exploraciones"
        href: exploraciones.qmd
      - text: "Recursos académicos"
        href: recursos/index.qmd
      - text: "Acerca del libro"
        href: acerca.qmd
  sidebar:
    style: docked
    search: true
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "I. Modelar y visualizar"
      chapters:
        - capitulos/fundamentos_iniciales_capitulo1.qmd
        - capitulos/soluciones_y_region_factible.qmd
        - capitulos/01-introduccion.qmd
        - capitulos/02-geometria.qmd
        - capitulos/ejemplo_metodo_grafico.qmd
    - part: "II. De la geometría al algoritmo"
      chapters:
        - capitulos/03-bases.qmd
    - part: "III. Algoritmos de resolución"
      chapters:
        - capitulos/04-simplex.qmd
    - part: "IV. Dualidad y análisis postóptimo"
      chapters:
        - capitulos/05-dualidad.qmd
        - capitulos/06-sensibilidad.qmd
    - part: "V. Modelos y aplicaciones"
      chapters:
        - capitulos/07-modelos.qmd
        - capitulos/08-entera.qmd
        - capitulos/09-aplicaciones.qmd
    - part: "Material complementario"
      chapters:
        - exploraciones.qmd
        - recursos/index.qmd
        - acerca.qmd
    - referencias.qmd

bibliography: bibliografia/referencias.bib
format:
  html:
    theme:
      light: cosmo
    css: estilos/editorial.css
    toc: true
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
    include-after-body: includes/footer.html
    html-math-method: mathjax

execute:
  echo: false
  warning: false
